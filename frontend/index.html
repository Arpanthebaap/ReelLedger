<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReelLedger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #262b36;
    --text: #e7e9ee; --muted: #9aa1ae; --accent: #4dd0a6; --danger: #e2665a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { padding: 24px 32px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #chat-log { height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { padding: 10px 14px; border-radius: 10px; max-width: 90%; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1e3a2e; }
  .msg.agent { align-self: flex-start; background: #1c2029; border: 1px solid var(--border); }
  .msg.pending { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0d0f14; color: var(--text); font-size: 14px;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent);
    color: #0a1a14; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .suggestions button { background: #1c2029; color: var(--text); border: 1px solid var(--border); font-weight: 400; font-size: 13px; }
  #chart-wrap { position: relative; height: 320px; }
  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>ReelLedger</h1>
  <p>Live financial exposure + comparable-title intelligence, in plain language.</p>
</header>
<main>
  <section class="panel">
    <h2>Ask ReelLedger</h2>
    <div class="suggestions">
      <button type="button" onclick="ask('Which department is trending over budget right now?')">Which department is over budget?</button>
      <button type="button" onclick="ask('We are an $8M elevated horror film with an unknown lead, releasing Q4. What outcome range should we expect?')">Comps for an $8M elevated horror film?</button>
      <button type="button" onclick="ask('If VFX keeps overspending at this rate, are comparable films at our new effective budget still viable?')">Combined exposure + comps question</button>
    </div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Ask about budget exposure or comparable titles..." autocomplete="off" />
      <button type="submit" id="send-btn">Ask</button>
    </form>
  </section>

  <section class="panel">
    <h2>Budget exposure by department</h2>
    <div id="chart-wrap"><canvas id="exposure-chart"></canvas></div>
    <div class="legend">
      <span><span class="dot" style="background:#4dd0a6"></span> Spent</span>
      <span><span class="dot" style="background:#2b303c"></span> Remaining budget</span>
      <span><span class="dot" style="background:#e2665a"></span> Over budget</span>
    </div>
  </section>
</main>

<script>
let sessionId = null;

function appendMessage(text, cls) {
  const log = document.getElementById('chat-log');
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function sendMessage(text) {
  appendMessage(text, 'user');
  const pending = appendMessage('Thinking...', 'agent pending');
  document.getElementById('send-btn').disabled = true;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    pending.textContent = data.reply || '(no response)';
    pending.classList.remove('pending');
  } catch (err) {
    pending.textContent = 'Error reaching ReelLedger backend: ' + err;
    pending.classList.remove('pending');
  } finally {
    document.getElementById('send-btn').disabled = false;
  }
}

function ask(text) { sendMessage(text); }

document.getElementById('chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendMessage(text);
});

let chart;
async function loadExposureChart() {
  try {
    const res = await fetch('/api/exposure-summary');
    const data = await res.json();
    const labels = data.departments.map(d => d.department);
    const spent = data.departments.map(d => Math.min(d.spent, d.budget));
    const over = data.departments.map(d => Math.max(d.spent - d.budget, 0));
    const remaining = data.departments.map(d => Math.max(d.budget - d.spent, 0));

    const ctx = document.getElementById('exposure-chart');
    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'Spent', data: spent, backgroundColor: '#4dd0a6', stack: 's' },
          { label: 'Over budget', data: over, backgroundColor: '#e2665a', stack: 's' },
          { label: 'Remaining', data: remaining, backgroundColor: '#2b303c', stack: 's' },
        ],
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked: true, ticks: { color: '#9aa1ae' }, grid: { color: '#262b36' } },
          y: { stacked: true, ticks: { color: '#e7e9ee' }, grid: { display: false } },
        },
      },
    });
  } catch (err) {
    document.getElementById('chart-wrap').innerHTML =
      '<p style="color:#9aa1ae;font-size:13px">Could not load exposure data. Have you run data/seed_synthetic_data.py against your ClickHouse instance?</p>';
  }
}

loadExposureChart();
</script>
</body>
</html>
